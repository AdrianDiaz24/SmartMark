version: '3.8'

services:
  # Servicio Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartmark-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    volumes:
      - ./backend/database:/app/database
      - ./backend/uploads:/app/uploads
    networks:
      - smartmark-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/links"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Servicio Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartmark-frontend
    ports:
      - "3001:3001"
    depends_on:
      - backend
    networks:
      - smartmark-network
    restart: unless-stopped
    environment:
      - REACT_APP_API_URL=http://localhost:3000/api

networks:
  smartmark-network:
    driver: bridge

volumes:
  smartmark-db:
  smartmark-uploads:
