version: '3.8'

services:
  # Servicio Backend
  backend:
    image: adriandiaz24/smartmark-backend:latest
    container_name: smartmark-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    volumes:
      - smartmark-db:/app/database
      - smartmark-uploads:/app/uploads
    networks:
      - smartmark-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/links"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Servicio Frontend
  frontend:
    image: adriandiaz24/smartmark-frontend:latest
    container_name: smartmark-frontend
    ports:
      - "3001:3001"
    environment:
      - REACT_APP_API_BASE_URL=http://localhost:3000/api
    depends_on:
      - backend
    networks:
      - smartmark-network
    restart: unless-stopped

networks:
  smartmark-network:
    driver: bridge

volumes:
  smartmark-db:
  smartmark-uploads:
