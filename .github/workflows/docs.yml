name: Generar Documentación con JSDoc

on:
  push:
    branches:
      - main

    paths:
      - 'backend/src/**'
      - '.github/workflows/docs.yml'
      - 'jsdoc.json'
  pull_request:
    branches:
      - main


jobs:
  build-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v3

      - name: Instalar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar dependencias (incluyendo devDependencies)
        run: npm install --save-dev

      - name: Verificar que JSDoc está instalado
        run: npx jsdoc --version

      - name: Verificar archivos de configuración
        run: |
          echo "Verificando jsdoc.json:"
          cat jsdoc.json
          echo ""
          echo "Verificando archivos en backend/src:"
          find backend/src -name "*.js" -type f | head -20

      - name: Limpiar documentación anterior
        run: rm -rf docs
        continue-on-error: true

      - name: Generar Documentación con JSDoc
        run: npx jsdoc -c ./jsdoc.json -t ./node_modules/better-docs

      - name: Verificar archivos generados
        run: |
          echo "Contenido de la carpeta docs:"
          ls -la docs/ || echo "Carpeta docs no existe"
          echo ""
          echo "Estructura de archivos generados:"
          find docs -type f | head -20 || echo "No hay archivos en docs"

      - name: Deploy a GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true



